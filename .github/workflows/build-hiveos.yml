name: Build HiveOS Custom Miner Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hiveos:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install NVIDIA CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Compile PearlMiner SM89 (main + lite presets)
        run: |
          mkdir -p pearlminer_sm89
          COMMON="-O3 -arch=sm_89 --use_fast_math -Xptxas=-dlcm=ca"
          LINK="-Xcompiler=-static-libstdc++,-static-libgcc -lpthread -ldl"

          echo "=== main preset (16 fragments / 5 blocks per SM) ==="
          nvcc $COMMON -Xptxas=-v -DN_FRAGMENTS=16 -DBLOCKS_PER_SM=5 \
            pearl_miner_sm89_ultimate.cu -o pearlminer_sm89/pearlminer_sm89 $LINK

          echo "=== lite preset (8 fragments / 8 blocks per SM) ==="
          nvcc $COMMON -Xptxas=-v -DN_FRAGMENTS=8 -DBLOCKS_PER_SM=8 \
            pearl_miner_sm89_ultimate.cu -o pearlminer_sm89/pearlminer_sm89_lite $LINK

          chmod +x pearlminer_sm89/pearlminer_sm89 pearlminer_sm89/pearlminer_sm89_lite
          ls -la pearlminer_sm89/

      - name: Generate HiveOS Integration Scripts (official custom-miner convention)
        run: |
          mkdir -p pearlminer_sm89

          cat << 'EOF' > pearlminer_sm89/h-manifest.conf
          CUSTOM_NAME=pearlminer_sm89
          CUSTOM_VERSION=4.4
          CUSTOM_CONFIG_FILENAME=/hive/miners/custom/pearlminer_sm89/miner.conf
          CUSTOM_LOG_BASENAME=/var/log/miner/custom/pearlminer_sm89
          EOF

          cat << 'EOF' > pearlminer_sm89/h-config.sh
          #!/usr/bin/env bash
          conf="--pool ${CUSTOM_URL} --wallet ${CUSTOM_TEMPLATE} ${CUSTOM_USER_CONFIG}"
          echo "$conf" > /hive/miners/custom/pearlminer_sm89/miner.conf
          EOF

          cat << 'EOF' > pearlminer_sm89/h-run.sh
          #!/usr/bin/env bash
          cd /hive/miners/custom/pearlminer_sm89 || exit 1
          BIN=./pearlminer_sm89
          if [[ ! -x $BIN ]]; then
            echo "[h-run] ERROR: pearlminer_sm89 binary missing or not executable!"
            ls -la /hive/miners/custom/pearlminer_sm89
            exit 1
          fi
          ARGS=$(cat miner.conf 2>/dev/null)
          [[ -z "$ARGS" ]] && ARGS="--pool prl-ae.kryptex.network:7048"
          # --preset lite switches to the low-register/high-occupancy kernel (benchmark both on your rig)
          if [[ "$ARGS" == *"--preset lite"* ]]; then
            BIN=./pearlminer_sm89_lite
            ARGS=${ARGS//--preset lite/}
          else
            ARGS=${ARGS//--preset main/}
          fi
          exec $BIN $ARGS
          EOF

          # Sourced by the HiveOS agent - MUST define $khs and $stats, do NOT echo output
          cat << 'EOF' > pearlminer_sm89/h-stats.sh
          khs=0
          stats="null"
          STATS_FILE="/tmp/pearlminer_stats.json"
          if [[ -f "$STATS_FILE" ]]; then
            stats=$(cat "$STATS_FILE" | tr -d '\n')
            if command -v jq >/dev/null 2>&1; then
              khs=$(jq -r '.khs // 0' "$STATS_FILE" 2>/dev/null)
            fi
          fi
          EOF

          chmod +x pearlminer_sm89/h-config.sh pearlminer_sm89/h-run.sh
          tar -czvf pearlminer_sm89-4.4.tar.gz pearlminer_sm89/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4
          name: "PearlMiner SM89 v4.4 (HiveOS & RTX 4070 Ti)"
          body: |
            ## v4.4
            - Kernel: removed 1024 shared-memory loads per nonce (B-side Philox seeds are now compile-time constants)
            - Kernel: generic fragment fold (supports 8 and 16 fragment presets)
            - Build: two binaries — `pearlminer_sm89` (main) and `pearlminer_sm89_lite` (higher occupancy)
            - New `--benchmark [seconds]` mode (no pool needed)
            - New `--gpu N` / `--gpu-id N` device selection
            - New `--help`
            - Occupancy report at startup
            - HiveOS: `--preset lite` in Extra config switches binary
          files: pearlminer_sm89-4.4.tar.gz
