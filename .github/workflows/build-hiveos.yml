name: Build HiveOS Pearl Miner (sm89) — real CPPminer backend

# v6.0+: This repo is an sm89 HiveOS packaging of the REAL, MIT-licensed
# CPPminer (https://github.com/1640675651/CPPminer), which implements the real
# Pearl cuPOW protocol (CUTLASS fused GEMM+XOR+jackpot, blake3 Merkle proof,
# plain_proof = base64(bincode proof), gzip for type:"v2" pools) and is proven
# against LuckyPool / Herominers / Kryptex. The previous synthetic .cu kernel
# was removed — it never produced pool-valid shares.

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hiveos:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (HiveOS wrapper scripts + flight sheet)
        uses: actions/checkout@v4

      - name: Install NVIDIA CUDA Toolkit 12.4 (nvcc + cudart, for cross-compile to sm89)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install Rust toolchain (for CPPminer cp-proof-ffi)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ git curl wget jq

      - name: Clone CPPminer v1.0 (MIT; proven Pearl backend)
        run: |
          git clone --depth 1 --branch v1.0 https://github.com/1640675651/CPPminer.git cppminer
          echo "CPPMINER_COMMIT=$(git -C cppminer rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "CPPminer pinned at ${{ env.CPPMINER_COMMIT }} (tag v1.0)"

      - name: Build CPPminer for sm89 (CUDA backend; cross-compiled, no GPU needed)
        env:
          # CUTLASS template instantiation is memory-heavy; cap parallelism so the
          # 7-16 GB Actions runner does not OOM. sm89 = Ada Lovelace (RTX 40 series).
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          cd cppminer
          ./build.sh --backend cuda --cuda-arch 89
          test -x build/cppminer || { echo "BUILD FAILED: build/cppminer missing"; ls -la build/; exit 1; }
          file build/cppminer
          du -h build/cppminer

      - name: Stage HiveOS package (binary + libcudart + wrapper scripts)
        run: |
          set -e
          mkdir -p pearlminer_sm89
          cp cppminer/build/cppminer pearlminer_sm89/pearlminer_sm89
          chmod +x pearlminer_sm89/pearlminer_sm89

          # Bundle libcudart.so so the binary runs on HiveOS without a CUDA toolkit install.
          # (libcuda.so / driver libs are provided by the NVIDIA driver on the rig.)
          CUDART="$(find "${CUDA_PATH:-/usr/local/cuda}" /usr/local/cuda* -name 'libcudart.so.*' -not -type l 2>/dev/null | head -1)"
          if [[ -n "$CUDART" ]]; then
            cp "$CUDART" pearlminer_sm89/
            # keep the unversioned soname symlink the loader expects
            SONAME="$(ldd pearlminer_sm89/pearlminer_sm89 2>/dev/null | grep -oE 'libcudart\.so\.[0-9]+' | head -1)"
            [[ -n "$SONAME" ]] && ln -sf "$(basename "$CUDART")" "pearlminer_sm89/$SONAME"
            echo "Bundled $CUDART"
          else
            echo "WARN: libcudart not found in CUDA_PATH=${CUDA_PATH:-/usr/local/cuda}; binary will need cudart on the rig."
          fi

          # HiveOS custom-miner wrapper scripts (kept in this repo's hiveos/ dir).
          cp hiveos/h-manifest.conf hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh pearlminer_sm89/
          chmod +x pearlminer_sm89/h-config.sh pearlminer_sm89/h-run.sh pearlminer_sm89/h-stats.sh

          # Derive version from the tag (fallback for branch pushes).
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${VERSION}/" pearlminer_sm89/h-manifest.conf

          echo "=== package contents ==="
          ls -la pearlminer_sm89/
          echo "=== linkage (driver libs are expected to be absent on the build runner) ==="
          ldd pearlminer_sm89/pearlminer_sm89 2>&1 | head -20 || true

          tar -czf "pearlminer_sm89-${VERSION}.tar.gz" pearlminer_sm89/
          ls -la "pearlminer_sm89-${VERSION}.tar.gz"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: PearlMiner SM89 ${{ env.PACKAGE_VERSION }} (real CPPminer backend)
          body: |
            ## PearlMiner SM89 ${{ env.PACKAGE_VERSION }} — REAL Pearl (PRL) mining

            This release ships the **real, MIT-licensed [CPPminer](https://github.com/1640675651/CPPminer)**
            (pinned at tag `v1.0`, commit `${{ env.CPPMINER_COMMIT }}`) built for **sm89 / Ada Lovelace
            (RTX 40 series)**, packaged as a HiveOS custom miner.

            ### Why this is real (unlike ≤ v5.9)
            - Backend = **CPPminer**, proven on **LuckyPool / Herominers / Kryptex**.
            - Real **Pearl cuPOW**: CUTLASS fused **GEMM + XOR + jackpot**, **blake3 Merkle proof**.
            - Real share format: `plain_proof` = **base64(bincode proof)**, **gzip**-wrapped for
              `type:"v2"` pools (Kryptex). Pools accept these shares.
            - v5.9 and earlier used a *synthetic* kernel that pools always rejected — they are
              deprecated; do not use them for production mining.

            ### Install (HiveOS)
            Import the flight sheet `hiveos-flight-sheet-custom-pearlminer_sm89.json`, set your PRL
            wallet, and HiveOS auto-installs this tarball. Or install manually:
            ```bash
            cd /hive/miners/custom/
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}/pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz
            tar -xzf pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz
            chmod +x pearlminer_sm89/*
            ```

            ### Verify shares are real
            After ~60 s, check your pool dashboard (Kryptex `pool.kryptex.com/prl`) for
            **accepted shares** and a non-zero hashrate. That is the only real proof of mining;
            the HiveOS `khs` number comes from CPPminer's `/hiveos` API endpoint.

            > Note: CPPminer's CUDA backend was originally tuned for Pascal; on Ada (sm89) it runs
            > via DP4A (int8 dot product, supported on Ada) and produces **valid shares**, though
            > not yet Ada-optimised for peak hashrate.

            ### License
            MIT. The miner binary is CPPminer (MIT, © its authors); this repo's packaging is MIT.
            See `LICENSE` and `NOTICE`.
          files: pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz
