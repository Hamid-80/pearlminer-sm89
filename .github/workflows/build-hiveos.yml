name: Build HiveOS Custom Miner Package

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]          # [v5.1] build an installable package for every release tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hiveos:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install NVIDIA CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Compile PearlMiner SM89 (main + lite presets)
        run: |
          mkdir -p pearlminer_sm89
          COMMON="-O3 -arch=sm_89 --use_fast_math -Xptxas=-dlcm=ca"
          LINK="-Xcompiler=-static-libstdc++,-static-libgcc -lpthread -ldl"

          # [v5.3 FIX] Register budget was never capped, so ptxas chose the maximum
          # and occupancy collapsed to 1-2 warps/SM. The GPU sat at ~45 W and 33 C
          # while reporting a tiny hashrate - the card was essentially idle.
          # acc[N_FRAGMENTS][4] alone costs 64 registers at N_FRAGMENTS=16, so cap
          # the budget explicitly and let ptxas spill the cold Philox temporaries.
          echo "=== main preset (16 fragments / 5 blocks per SM, 96 regs) ==="
          nvcc $COMMON -Xptxas=-v -maxrregcount=96 -DN_FRAGMENTS=16 -DBLOCKS_PER_SM=5 \
            pearl_miner_sm89_ultimate.cu -o pearlminer_sm89/pearlminer_sm89 $LINK 2>&1 | tee main_build.log

          echo "=== lite preset (8 fragments / 8 blocks per SM, 64 regs) ==="
          nvcc $COMMON -Xptxas=-v -maxrregcount=64 -DN_FRAGMENTS=8 -DBLOCKS_PER_SM=8 \
            pearl_miner_sm89_ultimate.cu -o pearlminer_sm89/pearlminer_sm89_lite $LINK 2>&1 | tee lite_build.log

          echo "=== register usage summary ==="
          grep -E "Used [0-9]+ registers|spill" main_build.log lite_build.log || true

          chmod +x pearlminer_sm89/pearlminer_sm89 pearlminer_sm89/pearlminer_sm89_lite
          ls -la pearlminer_sm89/

      - name: Generate HiveOS Integration Scripts (official custom-miner convention)
        run: |
          mkdir -p pearlminer_sm89

          cat << 'EOF' > pearlminer_sm89/h-manifest.conf
          CUSTOM_NAME=pearlminer_sm89
          CUSTOM_VERSION=4.4
          CUSTOM_CONFIG_FILENAME=/hive/miners/custom/pearlminer_sm89/miner.conf
          CUSTOM_LOG_BASENAME=/var/log/miner/custom/pearlminer_sm89
          EOF

          cat << 'EOF' > pearlminer_sm89/h-config.sh
          #!/usr/bin/env bash
          conf="--pool ${CUSTOM_URL} --wallet ${CUSTOM_TEMPLATE} ${CUSTOM_USER_CONFIG}"
          echo "$conf" > /hive/miners/custom/pearlminer_sm89/miner.conf
          EOF

          cat << 'EOF' > pearlminer_sm89/h-run.sh
          #!/usr/bin/env bash
          cd /hive/miners/custom/pearlminer_sm89 || exit 1
          BIN=./pearlminer_sm89
          if [[ ! -x $BIN ]]; then
            echo "[h-run] ERROR: pearlminer_sm89 binary missing or not executable!"
            ls -la /hive/miners/custom/pearlminer_sm89
            exit 1
          fi
          ARGS=$(cat miner.conf 2>/dev/null)
          [[ -z "$ARGS" ]] && ARGS="--pool prl-ae.kryptex.network:7048"
          # --preset lite switches to the low-register/high-occupancy kernel (benchmark both on your rig)
          if [[ "$ARGS" == *"--preset lite"* ]]; then
            BIN=./pearlminer_sm89_lite
            ARGS=${ARGS//--preset lite/}
          else
            ARGS=${ARGS//--preset main/}
          fi
          exec $BIN $ARGS
          EOF

          # Sourced by the HiveOS agent - MUST define $khs and $stats, do NOT echo output
          cat << 'EOF' > pearlminer_sm89/h-stats.sh
          khs=0
          stats="null"
          STATS_FILE="/tmp/pearlminer_stats.json"
          if [[ -f "$STATS_FILE" ]]; then
            stats=$(cat "$STATS_FILE" | tr -d '\n')
            if command -v jq >/dev/null 2>&1; then
              khs=$(jq -r '.khs // 0' "$STATS_FILE" 2>/dev/null)
            fi
          fi
          EOF

          chmod +x pearlminer_sm89/h-config.sh pearlminer_sm89/h-run.sh
          # [v5.1 FIX] derive the version from the tag instead of hard-coding it.
          # Before this, every build published a file called pearlminer_sm89-4.4.tar.gz
          # onto the v4.4 release, so v5.0 / v5.1 releases had NO installable asset
          # and the HiveOS flight-sheet install_url 404'd.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${VERSION}/" pearlminer_sm89/h-manifest.conf
          echo "Building pearlminer_sm89-${VERSION}.tar.gz"
          tar -czvf "pearlminer_sm89-${VERSION}.tar.gz" pearlminer_sm89/
          ls -la *.tar.gz

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          # attach to whatever tag triggered the build; for a branch push fall back to a rolling tag
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: PearlMiner SM89 ${{ env.PACKAGE_VERSION }}
          body: |
            ## PearlMiner SM89 ${{ env.PACKAGE_VERSION }}

            Installable HiveOS package: `pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz`

            ### Install
            ```bash
            cd /hive/miners/custom/
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}/pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz
            tar -xzf pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz
            chmod +x pearlminer_sm89/*
            ```
          files: pearlminer_sm89-${{ env.PACKAGE_VERSION }}.tar.gz

